# .autopilot.yml
#
# Configuration for the Autopilot maintenance agent.
# Generated by the Autopilot onboarding engine.
# See https://github.com/sullivanj91/maintbot for documentation.
#
# The constitutional_hash must be updated via a human-approved PR whenever
# the "## Autopilot Constraints" section of AGENT.md is changed. The agent
# will halt if the hash does not match.

# ─── Session Schedule ─────────────────────────────────────────────────────────
schedule:
  # How often to run scheduled sessions.
  # Options: "every-4-hours", "every-8-hours", "daily", "weekly"
  frequency: "every-8-hours"
  sessionTimeLimitMinutes: 30
  immediateTriggerOn:
    - label: "autopilot-urgent"
    - incidentSeverity: "critical"

# ─── Issues Task Queue ────────────────────────────────────────────────────────
issues:
  inputLabel: "autopilot-input"
  urgentLabel: "autopilot-urgent"
  filedLabel: "autopilot-filed"
  maxIssuesFiledPerSession: 3
  maxIssuesProcessedPerSession: 2

# ─── Transparency / Commit Format ─────────────────────────────────────────────
transparency:
  commitPrefix: "autopilot/session"
  sessionSummaryInCommit: true
  requireSignedCommits: false

# ─── Self-Evolution Configuration ─────────────────────────────────────────────
selfEvolution:
  # Minimum number of distinct repos a pattern must appear in before qualifying
  # as a self-evolution candidate.
  minReposForCandidate: 3

  # The self-evolution loop never self-merges. Always opens a PR.
  requireHumanMerge: true

  # Label added to self-evolution PRs so they are easy to find.
  prLabel: "autopilot-self-evolution"
# ─── Constitutional Hash ──────────────────────────────────────────────────────
# SHA-256 hash of the "## Autopilot Constraints" section in AGENT.md.
# Generated by: node -e "require('./dist/constraints').generateConstitutionalHash('.')"
# Must be updated via a human-approved PR when constraints change.
constitutionalHash: "sha256:d5c54bc1cec42d872337deac2747ba3d764a35fe6eafec9eebb72fa78147cee2"
