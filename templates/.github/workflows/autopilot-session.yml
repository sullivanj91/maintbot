# .github/workflows/autopilot-session.yml
#
# Autopilot Scheduled Session — installed into this repo by the Autopilot
# onboarding engine. Do not edit manually; changes will be overwritten on the
# next onboarding run. To customise behaviour, edit .autopilot.yml instead.
#
# Frequency and session time limit are read from .autopilot.yml:
#   schedule.frequency             (default: "every-8-hours")
#   schedule.session_time_limit_minutes  (default: 30)
#
# Session lifecycle (src/session.ts in the Autopilot repo):
#   1. Read last 10 AUTOPILOT_JOURNAL.md entries
#   2. Load relevant LEARNINGS.md entries (from Autopilot repo)
#   3. Verify constitutional constraints hash
#   4. Fetch & prioritize open autopilot-input issues
#   5. Run health checks → write findings to issue queue
#   6. Execute bounded work (time-limited)
#   7. Append + commit AUTOPILOT_JOURNAL.md  (always first commit)
#   8. Update LEARNINGS.md if new pattern found (always last commit)

name: Autopilot Scheduled Session

on:
  schedule:
    - cron: '0 */8 * * *'   # Override by editing the cron expression

  workflow_dispatch:
    inputs:
      trigger_type:
        description: 'Session trigger type'
        required: true
        default: 'scheduled'
        type: choice
        options:
          - scheduled
          - pr-merged
          - issue-urgent
          - incident
          - manual
      trigger_ref:
        description: 'PR number, issue number, or incident ID (optional)'
        required: false
        default: ''

jobs:
  autopilot-session:
    name: 'Autopilot Session (${{ github.event.inputs.trigger_type || ''scheduled'' }})'
    runs-on: ubuntu-latest

    permissions:
      contents: write        # commit AUTOPILOT_JOURNAL.md updates
      issues: write          # read autopilot-input, file autopilot-filed
      pull-requests: write   # open and comment on PRs

    steps:
      - name: Checkout target repo (this repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: target-repo
          token: ${{ secrets.AUTOPILOT_TOKEN }}

      - name: Checkout Autopilot repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.AUTOPILOT_REPO_SLUG }}
          ref: main
          path: autopilot-repo
          token: ${{ secrets.AUTOPILOT_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: autopilot-repo/package-lock.json

      - name: Install Autopilot dependencies
        working-directory: autopilot-repo
        run: npm ci

      - name: Build Autopilot
        working-directory: autopilot-repo
        run: npm run build

      - name: Configure git identity (target repo)
        working-directory: target-repo
        run: |
          git config user.name  "Autopilot Agent"
          git config user.email "autopilot@users.noreply.github.com"

      - name: Configure git identity (Autopilot repo)
        working-directory: autopilot-repo
        run: |
          git config user.name  "Autopilot Agent"
          git config user.email "autopilot@users.noreply.github.com"

      - name: Run Autopilot session
        env:
          GITHUB_TOKEN:         ${{ secrets.AUTOPILOT_TOKEN }}
          TRIGGER_TYPE:         ${{ github.event.inputs.trigger_type || 'scheduled' }}
          TRIGGER_REF:          ${{ github.event.inputs.trigger_ref || '' }}
          TARGET_REPO_PATH:     ${{ github.workspace }}/target-repo
          TARGET_REPO_SLUG:     ${{ github.repository }}
          AUTOPILOT_REPO_PATH:  ${{ github.workspace }}/autopilot-repo
          AUTOPILOT_REPO_SLUG:  ${{ vars.AUTOPILOT_REPO_SLUG }}
        working-directory: autopilot-repo
        run: node dist/session.js

      - name: Push session commits (target repo)
        working-directory: target-repo
        run: git push origin HEAD

      - name: Push LEARNINGS.md update (Autopilot repo, if changed)
        working-directory: autopilot-repo
        run: |
          if git diff --quiet HEAD; then
            echo "No changes to Autopilot repo — skipping push."
          else
            git push origin HEAD
          fi
