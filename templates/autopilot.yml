# .autopilot.yml
#
# Configuration for the Autopilot maintenance agent.
# Generated by the Autopilot onboarding engine.
# See https://github.com/<AUTOPILOT_REPO_SLUG> for documentation.
#
# The constitutional_hash must be updated via a human-approved PR whenever
# the "## Autopilot Constraints" section of AGENT.md is changed. The agent
# will halt if the hash does not match.

# ─── Session Schedule ─────────────────────────────────────────────────────────
schedule:
  # How often to run scheduled sessions.
  # Options: "every-4-hours", "every-8-hours", "daily", "weekly"
  frequency: "every-8-hours"

  # Maximum wall-clock time for a single session's work step.
  # Journal and LEARNINGS.md commits do not count against this limit.
  session_time_limit_minutes: 30

  # Triggers that bypass the queue and fire an immediate out-of-schedule session.
  immediate_trigger_on:
    - label: "autopilot-urgent"
    - incident_severity: "critical"

# ─── Issues Task Queue ────────────────────────────────────────────────────────
issues:
  # Label on human-filed issues the agent should pick up.
  input_label: "autopilot-input"

  # Label added to urgent human-filed issues that trigger immediate sessions.
  urgent_label: "autopilot-urgent"

  # Label on issues filed by the agent (constraint violations, deferred observations).
  filed_label: "autopilot-filed"

  # Safety caps per session.
  max_issues_filed_per_session: 3
  max_issues_processed_per_session: 2

# ─── Transparency / Commit Format ─────────────────────────────────────────────
transparency:
  # Prefix added to every agent commit.
  # e.g. "[autopilot/session-20260305-1400] fix: upgrade numpy"
  commit_prefix: "autopilot/session"

  # Include structured metadata block in every commit body.
  # Contains: trigger type, issues addressed, LEARNINGS.md consulted, etc.
  session_summary_in_commit: true

  # Set true for repos with GPG signing requirements.
  require_signed_commits: false

# ─── Constitutional Hash ──────────────────────────────────────────────────────
# SHA-256 hash of the "## Autopilot Constraints" section in AGENT.md.
# Generated by: node -e "require('./dist/constraints').generateConstitutionalHash('.')"
# Must be updated via a human-approved PR when constraints change.
constitutional_hash: ""  # Set during onboarding
